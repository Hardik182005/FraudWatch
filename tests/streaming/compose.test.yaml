# Isolated test overlay for the streaming workstream (project "fwstreamtest", never "fraudwatch").
# Provides minimal kafka / kafka-init / scoring services that compose.streaming.yaml depends on,
# with no host ports for Kafka. Run from the repo root:
#
#   FLINK_UI_HOST_PORT=18081 SPARK_UI_HOST_PORT=14040 docker compose -p fwstreamtest \
#     -f infra/compose/compose.streaming.yaml -f tests/streaming/compose.test.yaml --profile spark up -d
#   docker compose -p fwstreamtest down -v     # teardown (test volumes only)
#
# Paths below are relative to infra/compose (the first compose file's directory).
name: fwstreamtest

services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1g

  kafka-init:
    image: apache/kafka:4.1.2
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        mk() { $$T --bootstrap-server $$B --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1 $${3:+--config $$3}; }
        mk fraudwatch.transactions 4 message.timestamp.type=LogAppendTime
        mk fraudwatch.results.flink 4
        mk fraudwatch.results.spark 4
        mk fraudwatch.windows.flink 1
        mk fraudwatch.windows.spark 1
        mk fraudwatch.dlq 1
        mk fraudwatch.metrics.spark 1
        $$T --bootstrap-server $$B --describe --topic fraudwatch.transactions
        echo "topics ready"

  scoring:
    image: fraudwatch/scoring:1.0.0
    environment:
      SCORING_WORKERS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 768m
